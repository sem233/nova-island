[package]
name = "nova-app"
version = "1.8.11"
edition = "2021"
publish = false
description = "Nova Island"

# The app binary. Packaging renames it to "Nova Island.exe" (Cargo names can't have spaces).
[[bin]]
name = "nova-island"
path = "src/main.rs"

[dependencies]
nova-web = { path = "../nova-web" }
nova-assets = { path = "../nova-assets" }
nova-core = { path = "../nova-core" }
nova-sys = { path = "../nova-sys" }
nova-services = { path = "../nova-services" }
nova-render = { path = "../nova-render" }
webview2-com = "=0.39.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Dwm",
]

[build-dependencies]
embed-resource = "3"
