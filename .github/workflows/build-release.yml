name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload artifacts to (e.g. v1.8.8). Leave blank to skip release upload.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nova-next/target
          key: ${{ runner.os }}-cargo-gnu-${{ hashFiles('nova-next/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gnu-

      - name: Run workspace tests
        shell: powershell
        working-directory: nova-next
        run: |
          cargo +stable-x86_64-pc-windows-gnu test --workspace --locked
          if ($LASTEXITCODE) { throw "cargo tests failed" }

      - name: Install Pillow
        run: pip install pillow

      - name: Install NSIS
        run: choco install nsis --no-progress -y
        shell: powershell

      - name: Download yt-dlp.exe
        shell: powershell
        run: |
          $dir = "nova-next\target\release\tools"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dir\yt-dlp.exe" -UseBasicParsing
          Write-Host "yt-dlp: $((Get-Item "$dir\yt-dlp.exe").Length) bytes"

      - name: Build nova-island.exe (release)
        shell: powershell
        working-directory: nova-next
        run: |
          cargo +stable-x86_64-pc-windows-gnu build --release --locked -p nova-app
          if ($LASTEXITCODE) { throw "cargo build failed" }

      - name: Build installer & portable (NSIS)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File nova-next\installer\build.ps1

      - name: List dist output
        shell: powershell
        run: Get-ChildItem nova-next\target\dist | Select-Object Name,Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-island-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || github.run_number }}
          path: |
            nova-next/target/dist/Nova-Island-Setup-*.exe
            nova-next/target/dist/Nova-Island-*-Portable.exe
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            nova-next/target/dist/Nova-Island-Setup-*.exe
            nova-next/target/dist/Nova-Island-*-Portable.exe
          fail_on_unmatched_files: true
