name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to upload artifacts to (e.g. v1.8.8). Leave blank to skip release upload.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to upload to a release

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Rust (stable GNU – what build.ps1 uses) ───────────────────────────
      - name: Install Rust stable (GNU)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      # ── 3. Cargo cache ───────────────────────────────────────────────────────
      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nova-next/target
          key: ${{ runner.os }}-cargo-gnu-${{ hashFiles('nova-next/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gnu-

      # ── 4. Python + Pillow (for installer artwork make-art.py) ───────────────
      - name: Install Pillow
        run: pip install pillow

      # ── 5. NSIS ──────────────────────────────────────────────────────────────
      - name: Install NSIS
        run: choco install nsis --no-progress -y
        shell: powershell

      # ── 6. Download yt-dlp.exe (bundled into the installer) ──────────────────
      - name: Download yt-dlp.exe
        shell: powershell
        run: |
          $dir = "nova-next\target\release\tools"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $url = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          Invoke-WebRequest -Uri $url -OutFile "$dir\yt-dlp.exe" -UseBasicParsing
          Write-Host "yt-dlp: $((Get-Item "$dir\yt-dlp.exe").Length) bytes"

      # ── 7. Build exe ─────────────────────────────────────────────────────────
      - name: Build nova-island.exe (release)
        shell: powershell
        working-directory: nova-next
        run: |
          cargo +stable-x86_64-pc-windows-gnu build --release -p nova-app
          if ($LASTEXITCODE) { throw "cargo build failed" }

      # ── 8. Build installer + portable ────────────────────────────────────────
      - name: Build installer & portable (NSIS)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File nova-next\installer\build.ps1
        # build.ps1 runs cargo again internally; it will find the cached artifacts
        # and skip recompile. NSIS makes dist\Nova-Island-Setup-*.exe and Portable.

      # ── 9. List output files ─────────────────────────────────────────────────
      - name: List dist output
        shell: powershell
        run: Get-ChildItem nova-next\target\dist | Select-Object Name,Length

      # ── 10. Upload artifacts (always, for inspection) ────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-island-${{ github.ref_name || inputs.tag || 'manual' }}
          path: |
            nova-next/target/dist/Nova-Island-Setup-*.exe
            nova-next/target/dist/Nova-Island-*-Portable.exe
          if-no-files-found: error

      # ── 11. Upload to GitHub Release (only on tag push or manual with a tag) ──
      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
          files: |
            nova-next/target/dist/Nova-Island-Setup-*.exe
            nova-next/target/dist/Nova-Island-*-Portable.exe
          fail_on_unmatched_files: true
